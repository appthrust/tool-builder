<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AppThrust Internal Tool Builder</title>
    <script>
      // Apply the saved theme before the first paint (see src/theme.ts).
      (function () {
        var m = document.cookie.match(/(?:^|;\s*)appthrust-theme=(light|dark)/)
        var dark = m ? m[1] === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
